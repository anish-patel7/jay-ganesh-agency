services:
  - type: web
    name: jay-ganesh-agency
    runtime: node
    plan: free
    region: singapore
    buildCommand: npm install
    startCommand: node server/index.js
    healthCheckPath: /api/status
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      - key: SERVER_ENABLED
        value: "true"
      - key: TRUST_PROXY
        value: "true"
      - key: SESSION_SECRET
        generateValue: true
      # Fill these in on Render when it asks (they stay private):
      - key: GOOGLE_SHEETS_ID
        sync: false
      - key: GOOGLE_SERVICE_ACCOUNT_JSON
        sync: false
      - key: ADMIN_MOBILE
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      # Leave these false until registrations / payments should open.
      - key: OPERATIONS_ENABLED
        value: "false"
      - key: POLICY_APPROVED
        value: "false"
      - key: FIREWORKS_LEGAL_CLEARANCE
        value: "false"
